name: Publish to pub.dev

on:
  workflow_call:
    inputs:
      packages_folder_path:
        description: 'Path to the packages folder'
        required: true
        type: string
      packages:
        description: 'List of packages to publish (one per line)'
        required: true
        type: string
      flutter_version_file:
        description: 'Optional path to a Flutter version file, such as .fvmrc'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare package list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Convert packages to JSON array
        id: set-matrix
        run: |
          packages=$(echo "${{ inputs.packages }}" | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$packages" >> $GITHUB_OUTPUT

  publish:
    name: Publish ${{ matrix.package }} to pub.dev
    needs: prepare
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: ${{ inputs.flutter_version_file }}
          cache: true

      - name: Read the Flutter Dart SDK version
        id: dart-version
        run: echo "version=$(cat "$FLUTTER_ROOT/bin/cache/dart-sdk/version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies for ${{ matrix.package }}
        working-directory: ${{ inputs.packages_folder_path }}/${{ matrix.package }}
        run: |
          if grep -q "sdk: flutter" pubspec.yaml; then
            echo "Installing Flutter dependencies..."
            flutter pub get
          else
            echo "Installing Dart dependencies..."
            dart pub get
          fi

      - name: Run tests for ${{ matrix.package }}
        working-directory: ${{ inputs.packages_folder_path }}/${{ matrix.package }}
        run: |
          if [ -d "test" ]; then
            if grep -q "sdk: flutter" pubspec.yaml; then
              echo "Running Flutter tests..."
              flutter test
            else
              echo "Running Dart tests..."
              dart test
            fi
          else
            echo "No test folder found, skipping tests."
          fi

      - name: Restore checked-in files for ${{ matrix.package }}
        working-directory: ${{ inputs.packages_folder_path }}/${{ matrix.package }}
        run: |
          # `flutter pub get` runs Flutter's AnalysisOptionsMigration, which
          # rewrites analysis_options.yaml whenever the platform excludes are
          # absent. `dart pub publish` then refuses to publish from a dirty
          # tree and exits 65, after every gate has already passed. Publish
          # the committed tree, not whatever dependency resolution or the
          # test run left behind.
          modified=$(git diff --name-only -- .)
          if [ -n "$modified" ]; then
            echo "::warning::Build steps modified checked-in files; restoring them before publish. Files: $(echo "$modified" | tr '\n' ' ')"
            echo "$modified"
            git checkout -- .
          else
            echo "Working tree is clean."
          fi

      - name: Publish ${{ matrix.package }} - dry run
        working-directory: ${{ inputs.packages_folder_path }}/${{ matrix.package }}
        run: dart pub publish --dry-run

      # Public dependency metadata must not receive the publishing credential.
      # Provision it after validation, using the same Dart version as Flutter.
      - name: Set up Dart (provision OIDC)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ steps.dart-version.outputs.version }}

      - name: Publish ${{ matrix.package }} to pub.dev (OIDC)
        working-directory: ${{ inputs.packages_folder_path }}/${{ matrix.package }}
        # The required dry run above already resolves and validates this package.
        # Repeating resolution with OIDC authenticates public advisory requests,
        # which pub.dev rejects with HTTP 403 before the upload can start.
        # Keep the dry run mandatory and make no package changes between steps.
        run: dart pub publish --force --skip-validation
