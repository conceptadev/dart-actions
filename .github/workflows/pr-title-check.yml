name: Pull-Request Title Check
on:
  workflow_call:
    inputs:
      comment_header:
        description: Header used for the PR lint comment.
        type: string
        default: pr-title-lint-error
      comment_message:
        description: Explanation to show before the runtime lint diagnostic.
        type: string
        default: "Please use a Conventional Commit title such as fix(scope): description."

permissions: {}

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # No checkout or PR-head code execution in this write-enabled job.
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update lint comment when write access is available
        if: >-
          ${{ always() && !cancelled() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' &&
          (steps.lint_pr_title.outputs.error_message != '' || steps.lint_pr_title.outcome == 'success') }}
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COMMENT_HEADER: ${{ inputs.comment_header }}
          COMMENT_MESSAGE: ${{ inputs.comment_message }}
          LINT_ERROR: ${{ steps.lint_pr_title.outputs.error_message }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            // Keep user-controlled text in data, never in executable script.
            const header = process.env.COMMENT_HEADER;
            if (!/^[a-zA-Z0-9_-]{1,100}$/.test(header)) {
              throw new Error('comment_header must use 1-100 letters, digits, underscores or hyphens');
            }
            const marker = `<!-- dart-actions:${header} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            const error = process.env.LINT_ERROR;
            if (error) {
              const body = `${marker}\n${process.env.COMMENT_MESSAGE}\n\n${error}`.slice(0, 60000);
              if (previous) {
                await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
              } else {
                await github.rest.issues.createComment({owner, repo, issue_number, body});
              }
            } else if (previous) {
              await github.rest.issues.deleteComment({owner, repo, comment_id: previous.id});
            }
