name: release_toolkit
description: >-
  Deterministic release planning for Dart and Flutter workspaces. The
  same library and CLI run locally and inside GitHub Actions.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  pub_semver: ^2.1.4
  yaml: ^3.1.2
  yaml_edit: ^2.2.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
